# Workshop override, loaded as a third --config layer by ./Dockerfile's CMD,
# on top of the scaffolded app's own app-config.yaml and
# app-config.production.yaml. Backstage merges config files by priority and
# replaces arrays (including catalog.locations) wholesale rather than
# concatenating them, so this file's `locations` list is what actually takes
# effect at runtime -- it is not appended to the example locations that ship
# in app-config.production.yaml.
# Source: https://backstage.io/docs/conf/writing (read 2026-09-30).
#
# NOTE for the presenter -- UNVERIFIED, please test before the workshop:
# app-config.production.yaml (generated by @backstage/create-app) sets
# `auth.providers.guest: {}` by default, and this file does not override
# that. But https://backstage.io/docs/deployment/docker (read 2026-09-30)
# lists "Setup an auth provider" as prerequisite #2, with this exact warning:
# "the default Guest auth provider is not intended for use in containerized
# environments" -- and separately, the guest-provider docs
# (https://backstage.io/docs/auth/guest/provider, read 2026-09-30) say the
# provider is "explicitly disabled for non-development environments" (this
# Dockerfile sets NODE_ENV=production). This workshop's end state only needs
# a developer to browse the catalog and open "Create", so guest auth was kept
# for simplicity rather than asking the presenter to register a real OAuth
# app before the workshop -- but neither doc says explicitly whether sign-in
# actually fails outright under these conditions or just isn't supported/
# recommended. This was not run in Docker in this environment, so it is
# unverified: confirm guest sign-in actually works end to end before going on
# stage, and swap in a real auth provider (see the Authentication guide the
# Docker doc links to) if it does not.
catalog:
  # The default app-config.yaml.hbs (read 2026-09-30, via
  # https://raw.githubusercontent.com/backstage/backstage/master/packages/create-app/templates/default-app/app-config.yaml.hbs)
  # sets this to `allow: [Component, System, API, Resource, Location]`.
  # Config arrays are replaced wholesale, not merged (see this file's header
  # comment), so this override must repeat that full default list and add
  # `Template` to it -- otherwise the Template entity discovered below would
  # be rejected by catalog processing. `Template` is not in the shipped
  # default's global rule; the default app-config.yaml.hbs instead allows it
  # only via a `rules:` key scoped to that one config-based location entry
  # (a field documented only on config-based catalog.locations items, not on
  # a `kind: Location` catalog entity's `spec` --
  # https://backstage.io/docs/features/software-catalog/descriptor-format,
  # read 2026-09-30, documents just `type`/`target`/`targets`/`presence` for
  # the Location entity's spec). Because the Location entity in
  # ./catalog-info.yaml has no such per-location override available, the
  # global rule is widened here instead.
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    # The single seed location: ./catalog-info.yaml holds this workshop
    # step's own Component entry AND a second (Location-kind) document that
    # in turn discovers the sibling scaffolder template at the fixed-contract
    # path ../02-template/template.yaml -- see that file's own comments.
    # File locations resolve relative to the backend process's working
    # directory in a container, i.e. /app (WORKDIR in ./Dockerfile).
    # Source: app-config.production.yaml, generated by @backstage/create-app
    # (read 2026-09-30): "File locations are relative to the backend
    # process, typically in a deployed context, such as in a Docker
    # container, this will be the root."
    - type: file
      target: ./catalog-info.yaml
