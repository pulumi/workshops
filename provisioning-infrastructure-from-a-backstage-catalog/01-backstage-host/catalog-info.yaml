# This workshop step's own catalog entry, plus the Location entity that
# discovers the sibling scaffolder template. Both documents are registered
# together because app-config.workshop.yaml seeds the catalog with just this
# one file (type: file, target: ./catalog-info.yaml).
#
# Component field shape and the default owner/lifecycle placeholder values
# below follow the catalog-info.yaml.hbs generated by @backstage/create-app
# (read 2026-09-30, via
# https://raw.githubusercontent.com/backstage/backstage/master/packages/create-app/templates/default-app/catalog-info.yaml.hbs).
# Required/optional Component and Location fields per
# https://backstage.io/docs/features/software-catalog/descriptor-format
# (read 2026-09-30).
#
# PRESENTER TODO: replace `owner: workshop-team` below with a real
# user or group ref from your own organization's catalog before this goes on
# stage -- "workshop-team" is a placeholder, not a registered entity.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-host
  description: >-
    The self-hosted Backstage instance (Docker Compose, one EC2 host) built
    in workshop step 01-backstage-host.
spec:
  type: service
  lifecycle: experimental
  owner: workshop-team
---
# The Location entity that discovers the scaffolder template built in the
# sibling 02-template workshop step. This target path is a fixed contract
# with that step -- do not change it without updating 02-template/template.yaml
# and docker-compose.yml's matching bind mount.
#
# A `kind: Location` entity's spec supports only type/target/targets/presence
# (no `rules` field -- that only exists on config-based catalog.locations
# entries). Because Template is not in Backstage's default global
# catalog.rules, app-config.workshop.yaml widens that global rule to include
# Template instead of trying to scope it to this one Location entity. See
# that file's comments for the full explanation.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: backstage-host-template-discovery
  description: >-
    Discovers the software template built in the sibling 02-template
    workshop step.
spec:
  type: file
  target: ../02-template/template.yaml
