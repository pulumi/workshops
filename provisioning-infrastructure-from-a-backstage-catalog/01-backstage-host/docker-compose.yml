# Runs the scaffolded Backstage app (see ./setup.sh and ./Dockerfile) plus
# the Postgres database it requires in production mode.
#
# Why Postgres: the Backstage Docker deployment guide
# (https://backstage.io/docs/deployment/docker, read 2026-09-30) lists "A
# Postgres database setup that you are able to connect to" as a named
# prerequisite, and the app-config.production.yaml generated by
# @backstage/create-app (read 2026-09-30 via
# https://raw.githubusercontent.com/backstage/backstage/master/packages/create-app/templates/default-app/app-config.production.yaml)
# hard-codes `backend.database.client: pg` reading
# POSTGRES_HOST/POSTGRES_PORT/POSTGRES_USER/POSTGRES_PASSWORD from the
# environment. Our Dockerfile's CMD loads that file unedited, so Postgres is
# required, not optional; there is no supported sqlite path for this
# particular (production-mode, Docker) deployment shape. The embedded
# better-sqlite3 backend Backstage ships for local dev is explicitly marked
# "not recommended to use... in production" in the scaffolded app's own
# app-config.yaml comments.
#
# Bind-mount path semantics: relative host paths in the short volume syntax
# resolve against this Compose file's own directory
# (https://docs.docker.com/reference/compose-file/services/#volumes, read
# 2026-09-30), and a relative `dockerfile:` path resolves against `context:`
# (https://docs.docker.com/reference/compose-file/build/, read 2026-09-30).
services:
  backstage:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    ports:
      # Backstage's own Docker guide serves both the frontend and the API
      # from the single backend port in this production CMD shape: "you can
      # open your browser at http://localhost:7007". There is no separate
      # port 3000 process in this deployment (that split only applies to the
      # `yarn start` dev-server flow). Source: same Docker deployment guide
      # as above.
      - "7007:7007"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
    volumes:
      # Config and catalog files the image does not bake in (see
      # app-config.workshop.yaml's own header comment for why). Read-only
      # because the backend never needs to write to them.
      - ./app-config.workshop.yaml:/app/app-config.workshop.yaml:ro
      - ./catalog-info.yaml:/app/catalog-info.yaml:ro
      # The sibling workshop step's scaffolder template, mounted as a
      # sibling of /app (not nested inside it) so that the catalog Location
      # target in app-config.workshop.yaml can be the fixed-contract path
      # "../02-template/template.yaml", resolved relative to the backend's
      # working directory (/app, see WORKDIR in ./Dockerfile). This mirrors
      # the host layout, where 02-template/ is also a sibling of
      # 01-backstage-host/. Do not rename either side without updating the
      # other.
      - ../02-template:/02-template:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
      POSTGRES_DB: backstage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready ships with the official postgres image; this is the
      # standard readiness probe for it, not a Backstage-specific flag.
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
