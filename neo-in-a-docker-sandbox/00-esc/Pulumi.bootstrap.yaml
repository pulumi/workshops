# Run this stack ONCE from your laptop with your normal AWS credentials and a
# Pulumi login. Everything the demo stack (../02-app) needs is created here.
config:
  aws:region: eu-central-1
  # neo-workshop-esc:pulumiOrg: <your Pulumi organization>   # required, set with `pulumi config set pulumiOrg <org>`
  neo-workshop-esc:escProject: neo-workshop
  neo-workshop-esc:escEnvironment: aws-oidc
  neo-workshop-esc:bucketPrefix: neo-workshop-
  neo-workshop-esc:sessionDuration: 1h
  # neo-workshop-esc:existingOidcProviderArn: arn:aws:iam::123456789012:oidc-provider/api.pulumi.com/oidc
