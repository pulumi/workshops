# Reference copy of the Pulumi ESC environment that ../00-esc/index.ts creates
# as <org>/neo-workshop/aws-oidc. Shown on the slides; the real one is managed
# by `pulumi up` in this folder (the role ARN and region are filled in there).
values:
  aws:
    region: eu-central-1
    login:
      fn::open::aws-login:
        oidc:
          duration: 1h
          roleArn: arn:aws:iam::123456789012:role/neo-workshop-esc
          sessionName: neo-in-a-docker-sandbox
  environmentVariables:
    AWS_REGION: ${aws.region}
    AWS_ACCESS_KEY_ID: ${aws.login.accessKeyId}
    AWS_SECRET_ACCESS_KEY: ${aws.login.secretAccessKey}
    AWS_SESSION_TOKEN: ${aws.login.sessionToken}
  pulumiConfig:
    aws:region: ${aws.region}
