schemaVersion: "2"
kind: sandbox
name: neo-sandbox
displayName: Pulumi Neo in the Infrastructure Sandbox
description: >-
  Runs `pulumi neo` (Pulumi's infrastructure coding agent) as the sandbox agent
  on the prebuilt infrastructure-sandbox image: Pulumi CLI, Terraform, OpenTofu,
  kubectl/Helm and the AWS/Azure/gcloud CLIs are baked in, the Pulumi Cloud token
  is injected by the credential proxy, egress is limited to the allow-list below,
  and a PATH-shim guard blocks destructive pulumi/aws/terraform/tofu commands.
  Lives in the "Neo in a Docker Sandbox" workshop folder and builds on the
  published dirien/infrastructure-sandbox-kit image; usable on its own.
version: "0.10.0"
sourceURL: https://github.com/pulumi/workshops/tree/main/neo-in-a-docker-sandbox/neo-kit
licenses:
  - MIT

# Inputs. Both have defaults, so `sbx run ./neo-kit .` needs no arguments. Values
# land in NEO_SANDBOX_* (see `environment`) and the entrypoint turns them into
# `pulumi neo --approval-mode … --permission-mode …`. They are fixed at create
# time; to change a running sandbox's session, re-attach with
#   sbx run --name <sandbox> --env NEO_SANDBOX_PERMISSION_MODE=read-only
args:
  approvalMode:
    default: manual
    enum: [manual, balanced, auto]
    description: "pulumi neo --approval-mode: manual prompts on every tool call (the console's Review mode), balanced auto-approves low-risk calls, auto never prompts"
  permissionMode:
    default: default
    enum: [default, read-only]
    description: "pulumi neo --permission-mode: default uses your Pulumi RBAC, read-only blocks Pulumi Cloud writes"

sandbox:
  # The published infrastructure-sandbox-kit template image (Pulumi 3.260.0 with
  # `pulumi neo`, Terraform, OpenTofu, kubectl, Helm, AWS/Azure/gcloud CLIs).
  # The image's own agent (Claude Code) is not started; the entrypoint below
  # runs Neo instead.
  image: ghcr.io/dirien/infrastructure-sandbox:v0.9.0
  # The entrypoint is a small bash wrapper (files/home/.local/share/neo-sandbox/)
  # that prints the sandbox boundaries, finds the Pulumi project in the workspace
  # and execs `pulumi neo`. Invoked through bash so it works even if the runtime
  # drops the exec bit on static files. Extra `sbx run … -- <args>` are appended
  # to the pulumi neo command line.
  entrypoint: [bash, /home/agent/.local/share/neo-sandbox/neo-sandbox.sh]
  command:
    default: []
    interactive: []

# Egress allow-list (default-deny otherwise). The first groups mirror the
# infrastructure-sandbox-kit so the same image provisions and updates itself;
# the AWS group is what the workshop's S3 demo needs. Edit the region hosts for
# your own stacks (see the kit's docs/network.md).
# Kit-level enforcement covers exact hosts, host:port and single-label *.host.
permissions:
  network:
    allow:
      # Pulumi: Neo task API + SSE event stream, state, ESC, CLI/plugin downloads
      - api.pulumi.com
      - get.pulumi.com
      # Terraform + OpenTofu registries and downloads
      - releases.hashicorp.com
      - registry.terraform.io
      - registry.opentofu.org
      - get.opentofu.org
      # Kubernetes: kubectl + Helm downloads
      - dl.k8s.io
      - cdn.dl.k8s.io
      - get.helm.sh
      # Cloud CLIs: installer downloads + GPG-signed apt repos
      - awscli.amazonaws.com
      - packages.microsoft.com
      - packages.cloud.google.com
      - dl.google.com
      # OS packages (base image apt sources)
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com
      # GitHub: Pulumi/OpenTofu binaries, provider plugins, the kit's own scripts
      - github.com
      - api.github.com
      - codeload.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      # Language package registries (your IaC program's dependencies)
      - registry.npmjs.org
      - pypi.org
      - files.pythonhosted.org
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
      # AWS control plane for the workshop demo (S3 in eu-central-1). Credentials
      # come from Pulumi ESC at `pulumi up` time and are SigV4-signed in the VM,
      # so only the endpoints matter here. Change the region to match your ESC env.
      - sts.amazonaws.com
      - sts.eu-central-1.amazonaws.com
      - s3.amazonaws.com
      - "*.s3.amazonaws.com"
      - s3.eu-central-1.amazonaws.com
      - "*.s3.eu-central-1.amazonaws.com"
      # Other clouds' identity/control-plane starters (parity with ../kit)
      - management.azure.com
      - login.microsoftonline.com
      - graph.microsoft.com
      - accounts.google.com
      - oauth2.googleapis.com
      - "*.googleapis.com"

# Pulumi Cloud token: declared here, bound on the host with
#   sbx secret set -g pulumi
# The proxy injects `Authorization: token <PAT>` on api.pulumi.com. Inside the VM
# PULUMI_ACCESS_TOKEN only ever holds the `proxy-managed` placeholder, and that is
# enough for `pulumi login`, `pulumi neo`, `pulumi up` and `pulumi env` (ESC).
credentials:
  - service: pulumi
    description: "Pulumi Cloud access token (pulumi neo, pulumi up, ESC via pulumi env)"
    required: true
    apiKey:
      name: PULUMI_ACCESS_TOKEN
      proxyManaged: true
      inject:
        - domain: api.pulumi.com
          header: Authorization
          format: "token %s"

environment:
  variables:
    PULUMI_SKIP_UPDATE_CHECK: "true"
    AWS_PAGER: ""
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    NEO_SANDBOX_APPROVAL_MODE: "${{ kit.args.approvalMode }}"
    NEO_SANDBOX_PERMISSION_MODE: "${{ kit.args.permissionMode }}"

setup:
  install:
    # 1. Same provisioning step as the kit's sandbox-kit/spec.yaml: a fast
    #    sentinel no-op on the baked image above; on any other image it installs
    #    the IaC toolchain from the pinned v0.9.0 scripts.
    - user: "1000"
      description: "Install the IaC toolchain if the image lacks it (no-op on ghcr.io/dirien/infrastructure-sandbox)"
      command: |
        set -eu
        export ISK_PULUMI_VERSION="3.260.0"
        export ISK_TERRAFORM_VERSION="1.16.0"
        export ISK_OPENTOFU_VERSION="1.12.6"
        export ISK_KUBECTL_VERSION="1.37.0"
        export ISK_HELM_VERSION="4.2.4"
        export ISK_AWSCLI_VERSION="2.36.34"
        export ISK_AZ_APT_DIST="noble"
        export ISK_INSTALL_CLOUDS="1"
        export ISK_APM_SETUP_REPO="dirien/my-claude-apm-setup"
        export ISK_APM_SETUP_REF="v0.6.2"
        export ISK_APM_VERSION="0.29.0"
        export ISK_INSTALL_DOTNET="0"
        KIT_REPO="dirien/infrastructure-sandbox-kit"
        KIT_REF="v0.9.0"
        DIR="$HOME/.local/share/infrastructure-sandbox-kit/scripts"
        if [ ! -f "$DIR/provision.sh" ]; then
          mkdir -p "$DIR"
          for s in lib.sh install-pulumi.sh install-iac.sh install-clouds.sh install-toolchains.sh setup-apm-home.sh apply-agent-config.sh startup.sh provision.sh; do
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
              -o "$DIR/$s" "https://raw.githubusercontent.com/$KIT_REPO/$KIT_REF/scripts/$s"
          done
        fi
        bash "$DIR/provision.sh"
    # 2. Install the guard shims (~/.local/bin/{pulumi,aws,terraform,tofu}) that
    #    front the real binaries, and make sure ~/.local/bin leads PATH in login
    #    shells too. Idempotent; re-asserted on every start below.
    - user: "1000"
      description: "Install the neo-sandbox guard shims and the entrypoint"
      command: |
        set -eu
        bash "$HOME/.local/share/neo-sandbox/install-shims.sh"
  startup:
    - user: "1000"
      description: "Re-assert the neo-sandbox guard shims (idempotent)"
      command:
        - bash
        - -c
        - 'f="$HOME/.local/share/neo-sandbox/install-shims.sh"; [ -f "$f" ] && bash "$f" || true'
  files:
    # The entrypoint reads this to find the primary workspace even when the
    # runtime starts it elsewhere (${WORKDIR} is substituted by sbx at start).
    - path: /home/agent/.config/neo-sandbox/workspace
      content: "${WORKDIR}"
      mode: "0644"

# Neo's own tools are restricted to the workspace (plus /tmp), and sbx writes this
# profile file next to the workspace rather than inside it, so Neo does not
# necessarily see it. Ship an AGENTS.md inside your project for instructions Neo
# must read; this block documents the sandbox for humans and for agents that do
# read the profile.
agentInstructions:
  filename: AGENTS.md
  content: |
    # Pulumi Neo in a Docker Sandbox

    You are running inside a Docker Sandbox microVM. The host's filesystem is not
    visible beyond the mounted workspace, the Docker daemon is the sandbox's own,
    and outbound network is limited to an allow-list (Pulumi Cloud, AWS S3/STS in
    the configured region, package registries, GitHub).

    - `PULUMI_ACCESS_TOKEN` is `proxy-managed`: a host-side proxy injects the real
      token on api.pulumi.com. `pulumi login`, `pulumi up` and `pulumi env` work;
      the token itself never enters this VM.
    - No cloud credentials live in this VM. AWS credentials are short-lived and
      minted by Pulumi ESC when a stack that imports the environment runs.
      Never write credentials into files or code.
    - Destructive commands (`pulumi destroy`, `pulumi stack rm`, `pulumi state
      delete`, `aws … delete-*`, `terraform destroy`, …) are blocked by a guard
      on PATH. Do not try to work around it; ask the human to run them.
    - Always `pulumi preview` before `pulumi up`, and use the stack the project's
      `Pulumi.<stack>.yaml` selects; it imports the ESC environment.
