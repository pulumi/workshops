# Template. create-env.sh fills the three placeholders from `pulumi stack output`.
values:
  aws:
    login:
      fn::open::aws-login:
        oidc:
          roleArn: __ESC_ROLE_ARN__
          sessionName: secret-rotation-workshop
    secrets:
      fn::open::aws-secrets:
        region: us-east-1
        login: ${aws.login}
        get:
          current:
            secretId: __SECRET_ARN__
          previous:
            secretId: __SECRET_ARN__
            versionStage: AWSPREVIOUS
  app:
    token: ${aws.secrets.current}
    previous: ${aws.secrets.previous}
  environmentVariables:
    APP_TOKEN: ${app.token}
    APP_TOKEN_PREVIOUS: ${app.previous}
