# kind cluster config for this workshop. kind v0.33.0 (released 2026-08-26)
# ships Kubernetes v1.36.4 and v1.37.0 node images. This demo pins v1.36.4,
# not kind's v1.37.0 default: the KubeVirt to Kubernetes support matrix lists
# KubeVirt 1.9 against Kubernetes 1.34, 1.35 and 1.36 only
# (https://github.com/kubevirt/sig-release/blob/main/releases/k8s-support-matrix.md,
# read 2026-10-01). Config shape:
# https://kind.sigs.k8s.io/docs/user/configuration/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vms-workshop-demo
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
