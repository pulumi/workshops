# One control plane and three workers. Longhorn needs more than one node to
# show replication. Node image: Kubernetes v1.35.8, pre-built for kind v0.33.0
# (https://github.com/kubernetes-sigs/kind/releases/tag/v0.33.0). Longhorn 1.13
# requires Kubernetes >= 1.34.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: storage-workshop
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
