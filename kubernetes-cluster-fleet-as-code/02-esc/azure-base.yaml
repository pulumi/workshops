# fleet/azure-base: the Azure login and the config every stack shares.
# create.sh fills the three __PLACEHOLDERS__ before it uploads this file.
values:
  azure:
    login:
      fn::open::azure-login:
        clientId: __AZURE_CLIENT_ID__
        tenantId: __AZURE_TENANT_ID__
        subscriptionId: __AZURE_SUBSCRIPTION_ID__
        oidc: true
  environmentVariables:
    ARM_USE_OIDC: "true"
    ARM_CLIENT_ID: ${azure.login.clientId}
    ARM_TENANT_ID: ${azure.login.tenantId}
    ARM_SUBSCRIPTION_ID: ${azure.login.subscriptionId}
    ARM_OIDC_TOKEN: ${azure.login.oidc.token}
  pulumiConfig:
    azure-native:location: __LOCATION__
    fleet-cluster:vmSize: Standard_D2ds_v5
