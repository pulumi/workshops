---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: podinfo
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: podinfo
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    # podinfo HPA scales up to 10 replicas; cap at 25 leaves headroom for
    # rollouts and surge.
    pods: "25"
