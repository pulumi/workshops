---
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: gke-openclaw
  namespace: openclaw
spec:
  # GOOGLE_CLOUD_PROJECT is consumed by the google-vertex provider's
  # Application Default Credentials path. The token itself is provided by
  # GKE Workload Identity via the annotated ServiceAccount below.
  env:
    - name: GOOGLE_CLOUD_PROJECT
      value: "${gcp_project_id}"
  security:
    rbac:
      serviceAccountAnnotations:
        iam.gke.io/gcp-service-account: "openclaw-vertex@${gcp_project_id}.iam.gserviceaccount.com"
  config:
    mergeMode: merge
    raw:
      models:
        providers:
          google-vertex:
            # Vertex AI publisher endpoint, project-scoped. ADC token is
            # obtained automatically by the SDK via the Workload-Identity-bound
            # GSA. No API key.
            baseUrl: "https://aiplatform.googleapis.com/v1/projects/${gcp_project_id}/locations/global/publishers/google/models"
            models:
              - id: "gemini-2.5-flash"
                name: "Gemini 2.5 Flash"
                reasoning: false
                input:
                  - "text"
                contextWindow: 1048576
                maxTokens: 8192
      agents:
        defaults:
          model:
            primary: "google-vertex/gemini-2.5-flash"
            fallbacks: []
          sandbox:
            mode: "off"
      tools:
        profile: "full"
        allow:
          - "*"
        deny: []
        exec:
          security: "full"
  storage:
    persistence:
      enabled: true
      size: 10Gi
