---
# KSA bound to the GSA via GKE Workload Identity. The annotation tells the
# GKE metadata server to mint Vertex AI access tokens for this KSA. The GSA
# (created by Terraform under 00-infrastructure/vertex_iam.tf) holds
# roles/aiplatform.user and the matching iam.workloadIdentityUser binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adk-agent
  namespace: adk
  annotations:
    iam.gke.io/gcp-service-account: "openclaw-vertex@${gcp_project_id}.iam.gserviceaccount.com"
