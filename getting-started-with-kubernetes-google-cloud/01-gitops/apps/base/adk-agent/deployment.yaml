---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-agent
  namespace: adk
  labels:
    app.kubernetes.io/name: adk-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adk-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adk-agent
    spec:
      serviceAccountName: adk-agent
      # Pod-level securityContext required by PSA `restricted` on the
      # namespace. The image's USER myuser already runs non-root; this
      # makes that explicit to the kubelet and admission controller.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adk-agent
          # `:latest` + `Always` so a fresh image push + `kubectl rollout
          # restart deploy/adk-agent` ships the new code — no gitops PR.
          image: ghcr.io/dirien/adk-agent:latest
          imagePullPolicy: Always
          # Container-level securityContext to satisfy PSA `restricted`:
          # drop all caps, deny privilege escalation. Port 8000 is >1024
          # so we don't need NET_BIND_SERVICE back.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000
              name: http
          env:
            # Tell the Google GenAI SDK to use Vertex AI (not the AI Studio
            # API key flow). The SDK then reads ADC, which on GKE comes from
            # the metadata server using the WI-bound GSA.
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "1"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${gcp_project_id}"
            - name: GOOGLE_CLOUD_LOCATION
              value: "global"
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
