name: tf-modules-gitops
description: 'Terraform modules in Pulumi: push-to-deploy and drift detection'
runtime:
  name: nodejs
  options:
    packagemanager: npm
config:
  pulumi:tags:
    value:
      pulumi:template: typescript
packages:
  vpc-aws:
    source: pulumi/pulumi/hcl
    version: 0.18.4
    parameters:
      - module
      - terraform-aws-modules/vpc/aws
      - 6.7.3
