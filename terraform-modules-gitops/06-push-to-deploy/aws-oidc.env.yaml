# ESC environment tf-modules-gitops/aws-oidc: short-lived AWS credentials from
# an IAM role that trusts Pulumi Cloud through OIDC. No access key is stored.
# create-env.sh fills in the role ARN.
values:
  aws:
    login:
      fn::open::aws-login:
        oidc:
          roleArn: ROLE_ARN_PLACEHOLDER
          sessionName: tf-modules-gitops
          duration: 1h
  environmentVariables:
    AWS_ACCESS_KEY_ID: ${aws.login.accessKeyId}
    AWS_SECRET_ACCESS_KEY: ${aws.login.secretAccessKey}
    AWS_SESSION_TOKEN: ${aws.login.sessionToken}
    AWS_REGION: us-west-2
